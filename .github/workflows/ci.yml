name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main are never cancelled mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: my-portfolio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-portfolio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # prebuild refreshes src/data/github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Uploaded on every run (including PRs) so the exact artifact that would be
      # deployed can be inspected; only the gated `deploy` job below publishes it.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: my-portfolio/build
          retention-days: 7

  # Deploys to GitHub Pages only from main, and only once the owner opts in:
  #   1. Settings → Pages → Source: "GitHub Actions"
  #   2. Settings → Secrets and variables → Actions → Variables: PAGES_DEPLOY = true
  # Until then this job is skipped and the site keeps serving from the gh-pages branch.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
